# Ostro CI. scripts/ci-local.sh mirrors the lint job and the linux-x86_64-musl leg.
# Third-party actions are pinned to full commit SHAs (resolved with git ls-remote).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also start the optional Phase 7 jobs (acme-pebble, keda-kind; 07-22).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_DENY_VERSION: 0.21.0
  CARGO_ZIGBUILD_VERSION: 0.24.1
  # zig version verified locally with cargo-zigbuild (scripts/ci-local.sh, 01-07)
  ZIG_VERSION: 0.17.1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (Ostro crates, -D warnings)
        run: >-
          cargo clippy --workspace --all-targets --locked
          --exclude ostro-raft-rs --exclude ostro-raft-proto
          --exclude ostro-raft-driver --exclude ostro-wal
          -- -D warnings
      - name: Rust SDK workspace fmt + clippy (host + wasm32-wasip2)
        # separate workspace without a committed lock (no --locked); keep in sync with
        # check_sdk_lint in scripts/ci-local.sh
        run: |
          cargo fmt --manifest-path sdks/rust/Cargo.toml --all --check
          cargo clippy --manifest-path sdks/rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path sdks/rust/Cargo.toml --target wasm32-wasip2 -- -D warnings
      - name: cargo deny check
        run: cargo deny check
      - name: Vendored provenance check
        run: |
          jq --version
          bash scripts/check-vendored.sh
      - name: cargo-deny negative fixtures
        run: bash scripts/check-deny-fixtures.sh
      - name: No chronik / tokio-uring / prometheus in the tree
        # shared with ci-local.sh (P8-D17): anchored match, self-tested
        run: bash scripts/forbidden-crates.sh --self-test && bash scripts/forbidden-crates.sh

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # a green leg takes about an hour; a hung test fails the job instead of holding the
    # runner for the 6 h default (run 45109168904's aarch64 leg hung 2h50m)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            zig: true
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig: true
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            zig: false
          - name: linux-x86_64-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig: false
    env:
      T: ${{ matrix.target }}
    # Phase 6 DB legs (06-18, D-FX5): postgres:17 and mysql:8.4 on the linux-x86_64-gnu leg
    # only. Service containers exist only on Linux runners, so every other leg gets an empty
    # image, which skips the service. The passwords are throwaway CI values (>= 8 bytes: the
    # connector receives them as sealed secrets, whose minimum is 8 bytes). The URLs are
    # exported to that leg by the "Export Phase 6 DB service URLs" step.
    services:
      postgres:
        image: ${{ matrix.name == 'linux-x86_64-gnu' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: ostro-ci-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        # TLS: 8.4 generates its own certificates at first start (ssl-mode=REQUIRED works).
        image: ${{ matrix.name == 'linux-x86_64-gnu' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ostro-ci-pw
          MYSQL_DATABASE: ostro
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -postro-ci-pw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # Optional (not required; 06-13's mock covers the default suite): a real Vault dev
      # server for the OSTRO_TEST_VAULT_* legs.
      # vault:
      #   image: ${{ matrix.name == 'linux-x86_64-gnu' && 'hashicorp/vault:1.20' || '' }}
      #   env:
      #     VAULT_DEV_ROOT_TOKEN_ID: ostro-ci-vault-token
      #     VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      #   ports:
      #     - 8200:8200
      #   options: --cap-add IPC_LOCK
      # (then export OSTRO_TEST_VAULT_ADDR=http://127.0.0.1:8200 and
      #  OSTRO_TEST_VAULT_TOKEN=ostro-ci-vault-token in the export step below)
    steps:
      - if: runner.os == 'Linux'
        name: Free runner disk space
        # The hosted Ubuntu image has ~14 GB free; the workspace's debug test build plus the
        # extra gnu-leg builds (failpoints, release campaign, guests) ran it out of space
        # ("No space left on device" from rustc and the runner itself). Drop preinstalled
        # SDKs this workflow never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml) + target
        run: |
          rustup toolchain install
          rustup target add "$T"
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Drop the restored toolchain test cache
        # target/ostro-toolchains-test (the shared cache of the ostro-build toolchain tests:
        # uv + managed CPython + the componentize-py venv, wasi-sdk, zig, node) lives under
        # target/, so rust-cache saves and restores it, but not intact: a restore once
        # brought back a managed CPython without its _sysconfigdata_ file and no venv .ok,
        # and every Python build test failed in `uv venv`. Always start it fresh.
        run: rm -rf target/ostro-toolchains-test

      # --- musl legs: cargo-zigbuild + zig, static binary, mimalloc ---
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: matrix.zig
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - if: matrix.zig
        name: cargo-zigbuild test
        # the zigbuild test runner is `cargo-zigbuild test` (`cargo zigbuild` only builds)
        # --no-fail-fast: report every failing test binary in one run, not just the first
        run: cargo-zigbuild test --workspace --locked --no-fail-fast --target "$T"
      - if: matrix.zig
        name: cargo zigbuild --release (ostro)
        run: cargo zigbuild --release --locked -p ostro --target "$T"
      - if: matrix.zig
        name: Assert static binary + mimalloc
        run: |
          bin="target/$T/release/ostro"
          desc="$(file "$bin")"
          echo "$desc"
          grep -Eq 'statically linked|static-pie linked' <<<"$desc"
          info="$("$bin" build-info)"
          echo "$info"
          grep -q 'allocator=mimalloc' <<<"$info"
          grep -q "target=$T" <<<"$info"

      # --- native legs: macOS arm64, linux gnu (fast feedback) ---
      - if: matrix.name == 'linux-x86_64-gnu'
        name: Start SeaweedFS (shared Phase 6/8 S3 test spec)
        # 06-DECISIONS "Shared S3 test spec" (canonical for Phases 6 and 8; added by 08-03;
        # backend = SeaweedFS, Apache-2.0, per user direction 2026-11-20). `weed mini` is a
        # single-container S3 server on :8333; a docker-run step because service containers
        # cannot pass the `mini` command. Image pin: 4.54 is GitHub's latest release; if the
        # pull fails, fall back to the newest release tag confirmed on Docker Hub.
        # Exports the OSTRO_TEST_S3_* env to the later steps of this leg only.
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=ostro -e AWS_SECRET_ACCESS_KEY=ostroseaweed -e S3_BUCKET=ostro-test \
            chrislusf/seaweedfs:4.54 mini -dir=/data
          s3() { curl -s --aws-sigv4 "aws:amz:us-east-1:s3" --user ostro:ostroseaweed "$@"; }
          # readiness: the bucket answers a signed HEAD with 200 (S3_BUCKET creates it)
          ready=0
          for _ in $(seq 1 60); do
            if s3 -f -o /dev/null -I http://127.0.0.1:8333/ostro-test; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            # S3 is up but S3_BUCKET did not create the bucket: create it via the S3 API
            s3 -o /dev/null -X PUT http://127.0.0.1:8333/ostro-test || true
          fi
          s3 -f -o /dev/null -I http://127.0.0.1:8333/ostro-test || { docker logs seaweedfs; exit 1; }
          {
            echo "OSTRO_TEST_S3_URL=http://127.0.0.1:8333"
            echo "OSTRO_TEST_S3_ACCESS_KEY=ostro"
            echo "OSTRO_TEST_S3_SECRET_KEY=ostroseaweed"
            echo "OSTRO_TEST_S3_BUCKET=ostro-test"
          } >> "$GITHUB_ENV"
      - if: matrix.name == 'linux-x86_64-gnu'
        name: Export Phase 6 DB service URLs
        # 06-18: the postgres / mysql service containers above (healthy before the first
        # step). Same variable names as scripts/ci-local.sh; this leg only, so the other
        # legs keep SKIPping the DB legs.
        run: |
          {
            echo "OSTRO_TEST_PG_URL=postgres://postgres:ostro-ci-pw@127.0.0.1:5432/postgres"
            echo "OSTRO_TEST_MYSQL_URL=mysql://root:ostro-ci-pw@127.0.0.1:3306/ostro?ssl-mode=REQUIRED"
          } >> "$GITHUB_ENV"
      - if: ${{ !matrix.zig }}
        name: cargo test
        # --no-fail-fast: report every failing test binary in one run, not just the first
        run: cargo test --workspace --locked --no-fail-fast
      - if: matrix.name == 'linux-x86_64-gnu'
        name: ostro-objstore S3 conformance (SeaweedFS)
        # 08-03: conformance + conditional PUT (If-None-Match / If-Match, incl. the 412-on-
        # second-create smoke) + multipart against SeaweedFS; fails loudly here if the
        # OSTRO_TEST_S3_* env from the SeaweedFS step is missing.
        run: |
          test -n "${OSTRO_TEST_S3_URL:-}"
          cargo test -p ostro-objstore --test s3 --locked -- --nocapture
      - if: matrix.name == 'linux-x86_64-gnu'
        name: bottomless restore leg against S3 (SeaweedFS)
        # 08-20 SC3: a server backing up to s3://$OSTRO_TEST_S3_BUCKET/<unique prefix> is
        # killed with SIGKILL, `ostro restore --from s3://...` rebuilds a fresh data dir
        # (state hashes verified) and a server on it serves the completed runs. Same
        # SeaweedFS as the objstore leg above; fails loudly if the OSTRO_TEST_S3_* env is
        # missing (the test itself SKIPs when it is unset).
        run: |
          test -n "${OSTRO_TEST_S3_URL:-}"
          cargo test -p ostro --test bottomless_s3 --locked -- --nocapture
      - if: ${{ !matrix.zig }}
        name: semantics sleepers (serial)
        # WF-04 1,000-sleeper test: #[ignore]d in the parallel run, own process, one
        # thread (process RSS). Keep in sync with check_sleepers in scripts/ci-local.sh.
        run: cargo test -p ostro-server --test semantics_sleepers --locked -- --ignored --test-threads=1
      - if: matrix.name == 'linux-x86_64-gnu'
        name: Rust SDK workspace test + wasm32-wasip2 build
        # keep in sync with check_sdk_test / check_guests in scripts/ci-local.sh
        run: |
          cargo test --manifest-path sdks/rust/Cargo.toml
          cargo build --manifest-path sdks/rust/Cargo.toml --target wasm32-wasip2
          cargo build --release --target wasm32-wasip2 --manifest-path guests/Cargo.toml --target-dir target/guests
      - if: matrix.name == 'linux-x86_64-gnu'
        name: order-saga example (fmt + wasm32-wasip2 build + clippy)
        # standalone example project (no committed lock); keep in sync with
        # check_order_saga in scripts/ci-local.sh
        run: |
          cargo fmt --manifest-path examples/order-saga/Cargo.toml --check
          cargo build --release --target wasm32-wasip2 --manifest-path examples/order-saga/Cargo.toml --target-dir target/order-saga
          cargo clippy --target wasm32-wasip2 --manifest-path examples/order-saga/Cargo.toml --target-dir target/order-saga -- -D warnings
      - if: matrix.name == 'linux-x86_64-gnu'
        name: Failpoint suites
        # keep in sync with FAILPOINT_CRATES in scripts/ci-local.sh (same commands, same
        # order; ci-local's "failpoint list sync" step checks it)
        run: |
          cargo test -p ostro-wal --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-blob --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-log --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-partition --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-crashtest --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-meta --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-engine --features failpoints --test aot_failpoints --locked -- --test-threads=1
          cargo test -p ostro-server --features failpoints --test failpoints_phase5 --locked -- --test-threads=1
          cargo test -p ostro-backup --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-bridge --features failpoints --locked -- --test-threads=1
          cargo test -p ostro --features failpoints --test fx_redrive --locked -- --test-threads=1
          cargo test -p ostro --features failpoints --test fx_sql_crash --locked -- --test-threads=1
          cargo test -p ostro-worker --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-cluster --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-repl-conformance --features failpoints --locked -- --test-threads=1
          cargo test -p ostro-server --features failpoints --test children_failpoints --locked -- --test-threads=1
          cargo test -p ostro-server --features failpoints --test rerun_rearm --locked -- --test-threads=1
          cargo test -p ostro-server --features failpoints --test dlq_api --locked -- --test-threads=1
          cargo test -p ostro-server --features failpoints --test bulk_ops --locked -- --test-threads=1
          cargo test -p ostro --features failpoints --test ops_kill --locked -- --test-threads=1
      - if: matrix.name == 'linux-x86_64-gnu'
        name: Phase 7 failpoint legs + manifests
        # keep in sync with check_phase7 in scripts/ci-local.sh (07-22): the SIGSTOP zombie
        # and the 100-run QA-03 chaos smoke need the failpoint `ostro` binary; the other
        # Phase 7 spawned suites run in the cargo test step above.
        run: |
          out="$(cargo test -p ostro --features failpoints --test worker_failover --test fencing_chaos --locked -- --test-threads=1 sigstop_zombie chaos_smoke 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          test "$(grep -Ec 'test result: ok\. [1-9][0-9]* passed' <<<"$out")" -eq 2
          bash deploy/check-manifests.sh
      - if: matrix.name == 'linux-x86_64-gnu'
        name: Server campaign smoke (20 kills)
        # QA-01 whole-server kill campaign (plan 05-19) from a freshly wiped state dir; keep
        # in sync with check_campaign_smoke in scripts/ci-local.sh
        env:
          OSTRO_CAMPAIGN_STATE_DIR: target/campaign-smoke
          OSTRO_CAMPAIGN_FAULTS: "20"
        run: |
          rm -rf target/campaign-smoke
          cargo test --release -p ostro-crashtest --features failpoints --test server_campaign --locked -- --ignored --nocapture campaign
          cargo test --release -p ostro-crashtest --features failpoints --test server_campaign --locked -- --ignored --nocapture report
      - if: matrix.os == 'macos-15'
        name: cargo build --release (ostro) + build-info
        run: |
          cargo build --release --locked -p ostro
          info="$(target/release/ostro build-info)"
          echo "$info"
          grep -q 'allocator=mimalloc' <<<"$info"

  # ---------------------------------------------------------------------------------
  # Optional Phase 7 jobs (07-22): manual `workflow_dispatch` only, never on push/PR.
  # ---------------------------------------------------------------------------------

  acme-pebble:
    # SEC-01 ACME leg against Pebble (D-W23), loopback only: the order flow with
    # PEBBLE_VA_ALWAYS_VALID, then real HTTP-01 and TLS-ALPN-01 validation against the
    # client listener. Same commands as 07-10-SUMMARY "Pebble outcome".
    name: acme (Pebble)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      PEBBLE_VERSION: v2.10.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: acme-pebble
      - name: Build and start Pebble (loopback)
        run: |
          GOBIN="$PWD/target/pebble/bin" go install "github.com/letsencrypt/pebble/v2/cmd/pebble@${PEBBLE_VERSION}"
          P="$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@${PEBBLE_VERSION}"
          cat > target/pebble/pebble-config.json <<JSON
          {"pebble": {"listenAddress": "127.0.0.1:34000", "managementListenAddress": "127.0.0.1:35000",
            "certificate": "$P/test/certs/localhost/cert.pem", "privateKey": "$P/test/certs/localhost/key.pem",
            "httpPort": 35002, "tlsPort": 35001, "ocspResponderURL": "", "externalAccountBindingRequired": false,
            "retryAfter": {"authz": 1, "order": 1}}}
          JSON
          echo "PEBBLE_CA=$P/test/certs/pebble.minica.pem" >> "$GITHUB_ENV"
          PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 nohup target/pebble/bin/pebble \
            -config target/pebble/pebble-config.json -strict > target/pebble/pebble.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s --cacert "$P/test/certs/pebble.minica.pem" -o /dev/null https://127.0.0.1:34000/dir && break
            sleep 1
          done
          curl -sf --cacert "$P/test/certs/pebble.minica.pem" -o /dev/null https://127.0.0.1:34000/dir
      - name: ACME tests against Pebble (real HTTP-01 + TLS-ALPN-01 validation)
        env:
          OSTRO_TEST_ACME_DIRECTORY: https://127.0.0.1:34000/dir
          OSTRO_TEST_ACME_HTTP_PORT: "35002"
          OSTRO_TEST_ACME_TLS_PORT: "35001"
        run: |
          out="$(OSTRO_TEST_ACME_CA="$PEBBLE_CA" cargo test -p ostro-server --test acme --locked -- pebble --test-threads=1 2>&1)" || { echo "$out"; cat target/pebble/pebble.log; exit 1; }
          echo "$out"
          grep -Eq 'test result: ok\. 2 passed' <<<"$out"
          ! grep -q '^SKIP' <<<"$out"

  keda-kind:
    # WORK-05 real KEDA leg (D-W22): a throwaway kind cluster inside the GitHub runner, KEDA
    # from its Helm chart, the musl `ostro` in a scratch image, deploy/k8s + deploy/keda
    # applied with CI-only substitutions (image, small resource requests, a CI CA for the
    # client listener), then a burst on queue `heavy` must scale the worker Deployment
    # 0 -> N -> 0 and every run must complete. It never touches any other cluster.
    name: keda (kind)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      T: x86_64-unknown-linux-musl
      IMG: ostro-ci:local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml) + targets
        run: |
          rustup toolchain install
          rustup target add "$T" wasm32-wasip2
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: keda-kind
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Build the musl ostro, the cpu-burn guest and the scratch image
        run: |
          cargo zigbuild --release --locked -p ostro --target "$T"
          cargo build --release --target wasm32-wasip2 --manifest-path guests/Cargo.toml --target-dir target/guests -p cpu-burn
          mkdir -p target/ci-tls target/img/etc/ssl/certs
          # CI-only CA + client-listener certificate for ostro.ostro.svc (the cert-manager
          # Secret of the manifests); the CA goes into the image trust store so the worker's
          # platform verifier accepts the files-mode listener (D-W20).
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj /CN=ostro-ci-ca -keyout target/ci-tls/ca.key -out target/ci-tls/ca.crt
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=ostro.ostro.svc \
            -keyout target/ci-tls/tls.key -out target/ci-tls/tls.csr
          printf 'subjectAltName=DNS:ostro.ostro.svc,DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > target/ci-tls/ext.cnf
          openssl x509 -req -in target/ci-tls/tls.csr -CA target/ci-tls/ca.crt -CAkey target/ci-tls/ca.key \
            -CAcreateserial -days 2 -extfile target/ci-tls/ext.cnf -out target/ci-tls/tls.crt
          cp target/ci-tls/ca.crt target/img/etc/ssl/certs/ca-certificates.crt
          cp "target/$T/release/ostro" target/img/ostro
          printf 'FROM scratch\nCOPY etc /etc\nCOPY ostro /ostro\nENTRYPOINT ["/ostro"]\n' > target/img/Dockerfile
          docker build -t "$IMG" target/img
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ostro-ci
      - name: Install KEDA (Helm)
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm install keda kedacore/keda -n keda --create-namespace --wait --timeout 10m
          kind load docker-image "$IMG" --name ostro-ci
      - name: Deploy the server (deploy/k8s, CI substitutions)
        run: |
          mkdir -p target/k8s
          for f in deploy/k8s/*.yaml deploy/keda/*.yaml; do
            sed -e "s#ghcr.io/ostro-dev/ostro:latest#$IMG#" \
                -e 's#cpu: "2"#cpu: "100m"#; s#cpu: "8"#cpu: "1"#' \
                -e 's#memory: 2Gi#memory: 256Mi#; s#storage: 20Gi#storage: 1Gi#' \
                "$f" > "target/k8s/$(basename "$f")"
          done
          kubectl create namespace ostro
          kubectl -n ostro create secret tls ostro-api-tls --cert target/ci-tls/tls.crt --key target/ci-tls/tls.key
          kubectl apply -f target/k8s/server-statefulset.yaml
          kubectl -n ostro rollout status statefulset/ostro --timeout 5m
          kubectl -n ostro port-forward svc/ostro 7700:7700 > target/port-forward.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf --cacert target/ci-tls/ca.crt -o /dev/null https://localhost:7700/readyz && break
            sleep 1
          done
          curl -sf --cacert target/ci-tls/ca.crt https://localhost:7700/readyz
      - name: Join token, worker Deployment, KEDA ScaledObject
        env:
          OSTRO_SERVER: https://localhost:7700
          OSTRO_CA_FILE: target/ci-tls/ca.crt
        run: |
          ostro="target/$T/release/ostro"
          tok="$("$ostro" worker token create --ttl 2h --json)"
          token="$(jq -r .token <<<"$tok")"
          ca_hash="$(jq -r .join_command <<<"$tok" | sed -E 's/.*--ca-hash ([^ ]+).*/\1/')"
          sed -i -e "s#sha256:REPLACE-WITH-THE-CA-HASH-FROM-ostro-worker-token-create#$ca_hash#" \
                 -e "s#REPLACE-WITH-wkr_-JOIN-TOKEN#$token#" target/k8s/worker-deployment.yaml
          kubectl apply -f target/k8s/worker-deployment.yaml
          ca_pem="$(sed 's/^/    /' target/ci-tls/ca.crt)"
          python3 - "$ca_pem" <<'PY'
          import re, sys
          p = "target/k8s/trigger-auth.yaml"
          s = open(p).read()
          s = re.sub(r"    -----BEGIN CERTIFICATE-----\n    REPLACE-WITH-THE-OSTRO-CLUSTER-CA-PEM\n    -----END CERTIFICATE-----", sys.argv[1], s)
          open(p, "w").write(s)
          PY
          kubectl apply -f target/k8s/trigger-auth.yaml -f target/k8s/scaledobject-metrics-api.yaml
          "$ostro" deploy target/guests/wasm32-wasip2/release/cpu_burn.wasm --activate
          "$ostro" queue flow heavy --set placement=workers --set selector=pool=heavy
          test "$(kubectl -n ostro get deploy ostro-worker-heavy -o jsonpath='{.spec.replicas}')" = 0
      - name: Burst on queue heavy scales 0 -> N -> 0
        env:
          OSTRO_SERVER: https://localhost:7700
          OSTRO_CA_FILE: target/ci-tls/ca.crt
        run: |
          ostro="target/$T/release/ostro"
          : > target/runs.txt
          for _ in $(seq 1 40); do
            "$ostro" run cpu-burn --queue heavy --input '{"ms": 2000}' --json | jq -r .run_id >> target/runs.txt
          done
          max=0
          for _ in $(seq 1 60); do
            r="$(kubectl -n ostro get deploy ostro-worker-heavy -o jsonpath='{.spec.replicas}')"
            echo "replicas=$r demand=$(curl -s --cacert "$OSTRO_CA_FILE" https://localhost:7700/v1/queues/heavy/demand)"
            [ "${r:-0}" -gt "$max" ] && max="$r"
            [ "$max" -gt 0 ] && [ "${r:-0}" -eq 0 ] && break
            sleep 10
          done
          echo "max replicas: $max"
          test "$max" -ge 1
          while read -r id; do
            st="$("$ostro" inspect "$id" --json | jq -r .status)"
            [ "$st" = completed ] || { echo "run $id: $st"; exit 1; }
          done < target/runs.txt
          for _ in $(seq 1 30); do
            r="$(kubectl -n ostro get deploy ostro-worker-heavy -o jsonpath='{.spec.replicas}')"
            [ "${r:-0}" -eq 0 ] && break
            sleep 10
          done
          test "$(kubectl -n ostro get deploy ostro-worker-heavy -o jsonpath='{.spec.replicas}')" = 0
      - if: failure()
        name: Diagnostics
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n ostro logs statefulset/ostro --tail 200 || true
          kubectl -n ostro logs deploy/ostro-worker-heavy --tail 200 || true
          kubectl -n keda logs deploy/keda-operator --tail 200 || true

  # ---------------------------------------------------------------------------------
  # Phase 9 polyglot job (09-17): Python / TypeScript SDK host tests, the polyglot
  # conformance suites and the reproducible-build check. Keep in sync with the polyglot
  # block of scripts/ci-local.sh. Toolchains pinned per D-P9-28 (uv 0.7.15 exactly,
  # Node 24.13.0, Python 3.12). Publishing packages is never done here (D-P9-19).
  # ---------------------------------------------------------------------------------

  polyglot:
    name: polyglot (python + typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        # same as the test job: the conformance test build plus three guest toolchains
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml, incl. wasm32-wasip2)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: polyglot
      - name: Drop the restored toolchain test cache
        # target/ostro-toolchains-test (the shared cache of the ostro-build toolchain tests:
        # uv + managed CPython + the componentize-py venv, wasi-sdk, zig, node) lives under
        # target/, so rust-cache saves and restores it, but not intact: a restore once
        # brought back a managed CPython without its _sysconfigdata_ file and no venv .ok,
        # and every Python build test failed in `uv venv`. Always start it fresh.
        run: rm -rf target/ostro-toolchains-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: |
            sdks/scripts/toolchain/package-lock.json
            sdks/ts/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.7.15"
      # Phase 10 (10-02): clients/go (same pin as the acme-pebble job)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.23.x"
          cache: false
      - name: Polyglot toolchains present
        run: |
          node --version | grep -q '^v24\.'
          npm --version
          test "$(uv --version | awk '{print $2}')" = 0.7.15
          uv python find 3.12
      - name: Python SDK tests
        working-directory: sdks/python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-project --python 3.12 --with pytest==8.4.2 python -m pytest tests -q
      - name: TypeScript SDK tests
        # sdks/ts has no dependencies; the TAP reporter prints "# pass N" (Node 24's
        # default reporter prints "ℹ pass N")
        run: |
          (cd sdks/scripts/toolchain && npm ci --no-audit --no-fund)
          out="$(node --test --test-reporter=tap sdks/ts/test/ 2>&1)" || { echo "$out"; exit 1; }
          grep -E '^# (tests|pass|fail)' <<<"$out"
          grep -Eq '^# pass [1-9][0-9]*$' <<<"$out"
          grep -Eq '^# fail 0$' <<<"$out"
      - name: Polyglot conformance (ostro-conformance --features polyglot)
        # every test target incl. polyglot_python / polyglot_ts / polyglot_cross and
        # rebuild (C-REBUILD-01); the crash leg and resources stay #[ignore]
        run: cargo test -p ostro-conformance --features polyglot --locked -- --test-threads=2
      - name: clippy (polyglot feature)
        run: cargo clippy -p ostro-conformance --features polyglot --all-targets --locked -- -D warnings
      - name: Reproducible builds (repro-check, D-P9-3)
        # Rust must be bit-identical; Python / TS differ within the residuals accepted in
        # docs/sdk-builds.md (RESIDUAL-ACCEPTED markers)
        run: bash sdks/scripts/repro-check.sh all
      # Phase 10 (10-02): client test kits + ostro-build polyglot. Keep in sync with
      # scripts/ci-local.sh (check_clients_*, check_ostro_build_polyglot). Until 10-04 lands a
      # client directory its step prints "scaffold pending (10-04)"; 10-20 removes that path.
      - name: Build the debug ostro binary (client tests spawn it)
        run: |
          cargo build -p ostro --locked
          echo "OSTRO_BIN=$GITHUB_WORKSPACE/target/debug/ostro" >> "$GITHUB_ENV"
      - name: Clients python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ ! -f clients/python/pyproject.toml ]; then echo "SKIP clients python: scaffold pending (10-04)"; exit 0; fi
          cd clients/python
          uv run --no-project --python 3.12 --with pytest==8.4.2 python -m pytest tests -q
      - name: Clients ts
        run: |
          if [ ! -f clients/ts/package.json ]; then echo "SKIP clients ts: scaffold pending (10-04)"; exit 0; fi
          out="$(node --test --test-reporter=tap 'clients/ts/test/**/*.test.js' 2>&1)" || { echo "$out"; exit 1; }
          grep -E '^# (tests|pass|fail)' <<<"$out"
          grep -Eq '^# pass [1-9][0-9]*$' <<<"$out"
          grep -Eq '^# fail 0$' <<<"$out"
      - name: Clients go
        run: |
          if [ ! -f clients/go/go.mod ]; then echo "SKIP clients go: scaffold pending (10-04)"; exit 0; fi
          go version
          cd clients/go
          go vet ./...
          go test ./...
      - name: ostro-build polyglot
        # the ostro crate runs only its polyglot targets (parity, replay_cli,
        # template_tests) as later Phase 10 plans add them, not every spawned-binary suite
        run: |
          cargo clippy -p ostro-build --features polyglot --all-targets --locked -- -D warnings
          cargo clippy -p ostro --features polyglot --all-targets --locked -- -D warnings
          cargo test -p ostro-build --features polyglot --locked -- --test-threads=2
          targets=()
          for t in parity replay_cli template_tests; do
            if [ -f "crates/ostro/tests/$t.rs" ]; then targets+=(--test "$t"); else echo "ostro polyglot target $t: not present yet"; fi
          done
          if [ "${#targets[@]}" -gt 0 ]; then
            cargo test -p ostro --features polyglot "${targets[@]}" --locked -- --test-threads=1
          fi

  clean-machine:
    # SC1 (plan 10-19): `ostro init -> ostro dev -> ostro deploy -> ostro run` in fresh
    # ubuntu:24.04 and debian:12 containers with only ca-certificates installed (no cc, no
    # node, no cargo, no uv): the static musl ostro is mounted read-only and downloads
    # every toolchain hermetically. scripts/clean-machine.sh fails any language above
    # 600 s. The local approximation is `clean_machine local_all` (ci-local gate-only list).
    name: clean machine (SC1)
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      T: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml) + target
        run: |
          rustup toolchain install
          rustup target add "$T"
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clean-machine
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: cargo zigbuild --release (ostro, static musl)
        run: |
          cargo zigbuild --release --locked -p ostro --target "$T"
          bin="target/$T/release/ostro"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          ls -l "$bin"
          docker version
      - name: clean machine (ubuntu:24.04)
        run: |
          set -o pipefail
          bash scripts/clean-machine.sh all --image ubuntu:24.04 --ostro "target/$T/release/ostro" 2>&1 | tee clean-ubuntu.txt
      - name: clean machine (debian:12)
        run: |
          set -o pipefail
          bash scripts/clean-machine.sh all --image debian:12 --ostro "target/$T/release/ostro" 2>&1 | tee clean-debian.txt
      - name: CLEAN lines to the step summary
        if: always()
        run: |
          {
            echo '### Clean machine (SC1)'
            echo '```'
            cat clean-ubuntu.txt clean-debian.txt 2>/dev/null | grep -E '^CLEAN ' || echo 'no CLEAN lines'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
