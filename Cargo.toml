[workspace]
resolver = "3"
members = ["crates/*", "vendor/*"]
exclude = ["spikes", "ci/deny-fixtures", "guests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# vendored (see VENDORED.md). Vendored crates pin their own deps; add workspace pins
# (metrics, tracing, thiserror, raft, ...) only when an Ostro crate consumes them.
ostro-raft-driver = { path = "vendor/ostro-raft-driver" }
ostro-wal = { path = "vendor/ostro-wal" }
# stack (versions verified 2026-11-18)
# NOTE: no wasmtime `cache` feature — it pulls zstd-sys (C); Ostro owns its AOT cache (ENG-07).
wasmtime = { version = "=50.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "pooling-allocator", "parallel-compilation", "std", "addr2line", "demangle", "coredump"] }
tokio = { version = "1.54", features = ["full"] }
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "transport", "router"] }
tonic-prost = "0.14.9"
prost = "0.14.6"
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
redb = "4.6.0"
mimalloc = "0.1.52"
clap = { version = "4.6.8", features = ["derive", "env"] }
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# build
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
# panic strategy: leave default (unwind) until Phase 3 decides (catch_unwind around guest calls)

# Cranelift is slow unoptimised; optimise it even in dev/test builds (Phase 3).
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
