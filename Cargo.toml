[workspace]
resolver = "3"
members = ["crates/*", "vendor/*"]
exclude = ["spikes", "ci/deny-fixtures", "guests", "sdks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# vendored (see VENDORED.md). Vendored crates pin their own deps; add workspace pins
# (metrics, tracing, thiserror, raft, ...) only when an Ostro crate consumes them.
ostro-raft-driver = { path = "vendor/ostro-raft-driver" }
ostro-wal = { path = "vendor/ostro-wal" }
# stack (versions verified 2026-11-18)
# NOTE: no wasmtime `cache` feature — it pulls zstd-sys (C); Ostro owns its AOT cache (ENG-07).
wasmtime = { version = "=50.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "pooling-allocator", "parallel-compilation", "std", "addr2line", "demangle", "coredump"] }
tokio = { version = "1.54", features = ["full"] }
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "transport", "router"] }
tonic-prost = "0.14.9"
prost = "0.14.6"
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
mimalloc = "0.1.52"
clap = { version = "4.6.8", features = ["derive", "env"] }
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# Phase 3 engine / journal (shared pins; Phase 2 reuses serde/postcard/sha2/thiserror/tracing/proptest)
ostro-types = { path = "crates/ostro-types" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
sha2 = "0.11"
hmac = "0.13"
# exact: the deterministic RNG keystream must never change
chacha20 = "=0.10.2"
async-trait = "0.1.92"
thiserror = "2"
tokio-util = "0.7.20"
tracing = "0.1"
metrics = "0.24.6"
proptest = "1.12.0"
insta = "1"
# Phase 2 storage (versions verified 2026-11-18; serde/postcard/sha2/thiserror/tracing/metrics/proptest shared with Phase 3 above)
# partition state store; replaced redb after spike S3 — see PROJECT.md
fjall = "=3.1.13"
bytes = "1"
crc32c = "0.6.9"
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
uuid = { version = "1", features = ["v7"] }
fail = "0.5.1"
proptest-state-machine = "0.9.0"
ostro-testkit = { path = "crates/ostro-testkit" }
# Phase 4 single-node server (versions verified 2026-11-18)
utoipa = { version = "6.0.0", features = ["macros"] }
utoipa-axum = "0.3.0"
serde_json = "1"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
# exact: locked decision (Phase 4 research); chrono is banned
jiff = { version = "=1.0.1", features = ["serde", "tzdb-bundle-always"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
# OS RNG for run rng_seed / token key (same major as uuid's)
getrandom = "0.4.3"
# test HTTP client at workspace level (no TLS: no native-tls/openssl). ostro-bridge and
# ostro-objstore enable `rustls` and `stream` at member level (Phase 6 06-02, Phase 8 08-01).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2"] }
# WIT freeze tooling (05-05, ostro-witcheck). Exact: these are the versions wasmtime 50.0.2
# pulls (one copy in Cargo.lock). Bump only together with wasmtime (D17).
wit-component = { version = "=0.261.0", default-features = false, features = ["semver-check"] }
wit-parser = "=0.261.0"
# Phase 8 triggers / bottomless / observability (plan 08-01 declares every Phase 8 dependency
# once, P8-D21; versions verified 2026-11-19, 08-RESEARCH "Standard Stack").
# OTel: all opentelemetry* crates share 0.33; otlp is gRPC (tonic) only and never zstd
# (zstd-sys is C). Resolves to the locked tonic 0.14.9 / prost 0.14.6 (no duplicates, deny).
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace", "logs", "tls-aws-lc"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace", "logs"] }
tracing-opentelemetry = "0.34.0"
opentelemetry-appender-tracing = "0.33.1"
# /metrics text exposition; default features off = no hyper server, no prost
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# S3 SigV4 (sans-IO) for ostro-objstore; exact (P8-D5)
rusty-s3 = "=0.12.0"
url = "2.5.8"
futures-core = "0.3.34"
futures-util = "0.3.34"
# cron (P8-D9): croner's jiff backend only (never its default `chrono`). croner speaks jiff
# 0.2, so jiff02 is a second jiff major, used only inside ostro-triggers' adapter.
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
jiff02 = { package = "jiff", version = "0.2.46", default-features = false, features = ["alloc", "std"] }
# the bundled TZif bytes behind jiff 1.0 `tzdb-bundle-always` (same crate and version), read
# directly by ostro-triggers so both jiff majors parse identical bytes (08-05)
jiff-tzdb = "1.0.0"
# backup tar files (P8-D7); snapshot frame compression (same major as lsm-tree's lz4_flex)
tar = "0.4.46"
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
# Phase 6 effects bridge (plan 06-02; versions verified 2026-11-19, 06-RESEARCH "Workspace
# pins"). rusty-s3, url and futures-core/-util are already pinned by Phase 8 above.
# sqlx: no macros/migrate/any/sqlite; native roots only (webpki-roots is CDLA, D-FX2); no mysql-rsa
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs-native-roots", "postgres", "mysql", "json", "time", "bigdecimal", "uuid"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
ipnet = "2.12.2"
# same feature set rustls enables (aws-lc-sys + prebuilt-nasm): one aws-lc-sys build
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
zeroize = { version = "1.9.2", features = ["derive"] }
secrecy = "0.10.3"
# std only: keyed HashMap store + monotonic clock (no dashmap/quanta/jitter)
governor = { version = "0.10.4", default-features = false, features = ["std"] }
aho-corasick = "1"
vaultrs = { version = "0.8.0", default-features = false, features = ["rustls"] }
kube = { version = "5.1.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
# same version as already in Cargo.lock
base64 = "0.22"
# Phase 7 workers / placement / flow control (plan 07-02 declares every Phase 7 dependency
# once, D-W17; versions verified 2026-11-21). rcgen defaults pull ring: always off. No
# governor here: Phase 7 hand-rolls GCRA (D-W24). tonic TLS features (`tls-aws-lc`,
# `tls-connect-info`) are enabled at member level in ostro-server and ostro-worker.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
# already in Cargo.lock (same versions)
arc-swap = "1.9"
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = "1"
# build
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
# panic strategy: leave default (unwind) until Phase 3 decides (catch_unwind around guest calls)

# Cranelift is slow unoptimised; optimise it even in dev/test builds (Phase 3).
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
