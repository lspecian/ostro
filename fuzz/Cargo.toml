[package]
name = "ostro-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Phase 14 (14-01, D-P14-17): the cargo-fuzz workspace. Separate from the main workspace
# (excluded there; own lockfile generated by 14-07; dated nightly in rust-toolchain.toml).
# All target logic lives in the main-workspace crate `ostro-fuzz-targets`; each binary below
# (fuzz_targets/<name>.rs, written by 14-01b) only feeds libFuzzer bytes to
# `ostro_fuzz_targets::run`. Run: `cargo fuzz run <name>` from this directory.

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = "1.5.0"
ostro-fuzz-targets = { path = "../crates/ostro-fuzz-targets" }

[profile.release]
debug = 1

[[bin]]
name = "apply_command"
path = "fuzz_targets/apply_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_event_codec"
path = "fuzz_targets/journal_event_codec.rs"
test = false
doc = false
bench = false

[[bin]]
