# Ostro Rust guest SDK. A separate cargo workspace (not a member of the root workspace):
#   cargo build --target wasm32-wasip2 --manifest-path sdks/rust/Cargo.toml
# Plain cargo + wit-bindgen (no cargo-component). sdks/rust/Cargo.lock is not committed
# (same policy as guests/); dependency versions are pinned exactly in the member manifests.
#
# Member crates deliberately do NOT use `*.workspace = true` inheritance: guest crates in
# other workspaces depend on ostro-sdk by path, and explicit versions keep that simple.
[workspace]
resolver = "3"
members = ["ostro-sdk"]

# Pinned versions (written explicitly in each member manifest; a [workspace.dependencies]
# table would only trigger cargo's unused-workspace-dependency warning):
#   wit-bindgen = "=0.63.0"   (must match guests/ and the S2 toolchain)
#   serde       = "=1.0.229"  (derive)
#   serde_json  = "=1.0.154"
