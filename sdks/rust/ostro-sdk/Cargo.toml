[package]
name = "ostro-sdk"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Rust guest SDK for Ostro durable workflows (WIT ostro:runtime@0.1.0)"

# Explicit versions (no workspace inheritance) — see ../Cargo.toml.
[dependencies]
wit-bindgen = "=0.63.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ostro-sdk-macros = { path = "../ostro-sdk-macros", version = "=0.1.0" }
