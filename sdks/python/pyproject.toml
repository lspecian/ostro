[project]
name = "ostro"
version = "0.1.0"
description = "Python SDK for Ostro durable workflows (WIT ostro:runtime@0.1.0)"
requires-python = ">=3.12"
license = "Apache-2.0"
# The SDK runs inside a componentize-py guest: no runtime dependencies, ever.
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ostro"]
# `ostro/**` includes the vendored WIT copy (`ostro/wit/runtime.wit`, 09-02) and the
# `ostro/py.typed` marker.
include = ["ostro/**"]
exclude = ["**/__pycache__", "**/*.pyc"]

# Packaging dry run (09-17, docs/sdk-builds.md): the sdist ships the package only, no
# tests, examples or caches (hatchling adds pyproject.toml and PKG-INFO itself).
[tool.hatch.build.targets.sdist]
include = ["ostro/**"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the source tree clean: no .pytest_cache next to the package.
addopts = "-p no:cacheprovider"
