[package]
name = "p11-rerun-v2"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Built with the Rust SDK (sdks/rust). serde/serde_json pinned exactly, matching ostro-sdk.
[dependencies]
ostro-sdk = { path = "../../sdks/rust/ostro-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
