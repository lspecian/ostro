[package]
name = "fx-ssrf"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Phase 6 test guest (plan 06-09), built with the Rust SDK. serde/serde_json pinned
# exactly, matching ostro-sdk. Base64 is a local helper (no extra dependency).
[dependencies]
ostro-sdk = { path = "../../sdks/rust/ostro-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
