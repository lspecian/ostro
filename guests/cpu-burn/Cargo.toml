[package]
name = "cpu-burn"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Phase 7 test guest (plan 07-07, D-W15e), built with the Rust SDK. serde/serde_json pinned
# exactly, matching ostro-sdk.
[dependencies]
ostro-sdk = { path = "../../sdks/rust/ostro-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
