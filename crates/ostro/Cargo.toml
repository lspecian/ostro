[package]
name = "ostro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ostro"
path = "src/main.rs"

[features]
# Fault injection for the crash campaign (plans 05-18 / 05-19): compiles in every failpoint
# (ostro-server and everything under it) and calls `fail::FailScenario::setup()` in `main`,
# so the FAILPOINTS env var configures them. Build it out of the way of the release binary:
#   cargo build --release -p ostro --features failpoints --target-dir target/failpoints
# Phase 12 (12-01): the chain also reaches ostro-cluster (repl::/fetch::/isr::/install::) and
# ostro-meta (elect::) directly; tier-C replication tests spawn this binary.
failpoints = ["dep:fail", "fail/failpoints", "ostro-server/failpoints", "ostro-backup/failpoints", "ostro-worker/failpoints", "ostro-cluster/failpoints", "ostro-meta/failpoints"]

[dependencies]
mimalloc.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
ostro-server = { path = "../ostro-server" }
ostro-api = { path = "../ostro-api" }
# CLI-06 client verbs (05-14)
ostro-cli = { path = "../ostro-cli" }
# Phase 8: `ostro restore` / `ostro backup` (08-18)
ostro-backup = { path = "../ostro-backup" }
# Phase 7: `ostro worker` (07-15)
ostro-worker = { path = "../ostro-worker" }
# Phase 12 (12-01): failpoint feature chain (see [features])
ostro-cluster = { path = "../ostro-cluster" }
ostro-meta = { path = "../ostro-meta" }
fail = { workspace = true, optional = true }

[dev-dependencies]
# spawned-binary tests (04-19): REST + gRPC health against the real binary
tokio.workspace = true
tempfile.workspace = true
tonic.workspace = true
ostro-proto = { path = "../ostro-proto" }
# e2e (04-20): module sha256 for PUT /v1/modules/{sha256}
sha2.workspace = true
# CLI-06 (05-14): --json snapshots of the client verbs
insta.workspace = true
# Phase 7 (07-02): worker/TLS e2e (07-17..07-21): mock provider + canary, HTTPS client,
# files-mode certs (reqwest also serves the 04-19 spawned-binary tests)
ostro-testkit = { workspace = true, features = ["mock-http", "canary"] }
reqwest = { workspace = true, features = ["rustls", "json"] }
rcgen.workspace = true
x509-parser.workspace = true
# Phase 11 (11-03, B5): 11-14's CLI tests serve the API fakes in-process
# (ostro_api::router over FakeControlPlane + the 11-09 fakes)
ostro-api = { path = "../ostro-api", features = ["fake"] }
axum.workspace = true

[lints]
workspace = true
