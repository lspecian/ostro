// ostro.worker.v1: the leader <-> worker execution protocol (Phase 7, D-W2).
//
// One long-lived control stream per (worker, server node) (`Session`) plus bulk RPCs on the
// cluster listener ([cluster] listen, mTLS always). h2 multiplexes everything on one TLS
// connection, so a module fetch never delays a heartbeat.
//
// Field numbers belong to ostro-worker-proto and are versioned by PROTO_VERSION (the Rust
// constant `ostro_worker_proto::PROTO_VERSION`); they are not a RESERVATIONS.md space
// because this is a wire protocol, not a storage format. Append fields only.
//
// Every bulk RPC is authorized by (session_id of the caller's peer certificate, run, token):
// it must match a live remote lease on the server, else PERMISSION_DENIED /
// FAILED_PRECONDITION. Secret values never travel on this protocol (D-W3).
syntax = "proto3";

package ostro.worker.v1;

service Execute {
  // Control: small messages only.
  rpc Session(stream WorkerMsg) returns (stream ServerMsg);
  // Pull journal rows [from_seq, to_seq), lease-authorized, paged by max_frame_bytes.
  rpc FetchJournal(FetchJournalRequest) returns (stream JournalPage);
  // Modules and payload blobs, lease-authorized, chunked.
  rpc FetchBlob(FetchBlobRequest) returns (stream BlobChunk);
  // Usually one frame; an event larger than max_frame_bytes is split.
  rpc Append(stream AppendFrame) returns (AppendResult);
  // Bridge-back: the leader performs the effect (D-W3).
  rpc StartEffect(StartEffectRequest) returns (StartEffectResponse);
  // Client-certificate renewal over the authenticated channel.
  rpc Renew(RenewRequest) returns (RenewResponse);
}

// Attempt fencing token (epoch, n).
message Token {
  uint32 epoch = 1;
  uint32 n = 2;
}

message RunRef {
  bytes run_id = 1;
  uint32 partition = 2;
}

// ---------------------------------------------------------------------------------------
// Session stream
// ---------------------------------------------------------------------------------------

message WorkerMsg {
  oneof msg {
    Hello hello = 1;
    Credit credit = 2;
    Heartbeat heartbeat = 3;
    Done done = 4;
    CancelEffect cancel_effect = 5;
    GuestLogs guest_logs = 6;
    Drain drain = 7;
  }
}

message ServerMsg {
  oneof msg {
    Welcome welcome = 1;
    Activate activate = 2;
    Input input = 3;
    Cancel cancel = 4;
    LeaseLost lease_lost = 5;
    GoAway go_away = 6;
  }
}

message Hello {
  string worker_id = 1;
  uint32 proto_version = 2;
  string ostro_version = 3;
  string wasmtime_version = 4;
  uint32 event_codec_ver = 5;
  repeated string wit_packages = 6;
  map<string, string> labels = 7;
  uint32 slots = 8;
  uint64 memory_bytes = 9;
}

// The engine configuration a worker must adopt so embedded and remote runs behave the same
// (Pitfall 5).
message EngineLimits {
  uint64 hot_wait_ms = 1;
  uint64 activation_timeout_ms = 2;
  uint64 activation_fuel = 3;
  uint64 continue_as_new_events = 4;
  uint64 max_memory_bytes = 5;
  uint64 max_wasm_stack = 6;
  uint64 max_table_elements = 7;
  uint64 async_stack_size = 8;
  uint64 epoch_tick_ms = 9;
}

// A cluster member the worker should also connect to.
message Member {
  uint64 node_id = 1;
  string endpoint = 2;
}

message Welcome {
  bytes session_id = 1;
  uint64 node_id = 2;
  string cluster_id = 3;
  uint64 lease_ttl_ms = 4;
  // min([workers] heartbeat, lease_ttl / 3).
  uint64 heartbeat_ms = 5;
  uint32 max_frame_bytes = 6;
  EngineLimits limits = 7;
  repeated Member members = 8;
}

// Absolute and idempotent.
message Credit {
  uint32 free_slots = 1;
}

message Lease {
  RunRef run = 1;
  Token token = 2;
}

message Heartbeat {
  repeated Lease leases = 1;
  uint32 free_slots = 2;
  uint64 memory_used = 3;
}

message Activate {
  RunRef run = 1;
  Token token = 2;
  bytes module_sha = 3;
  uint64 journal_len = 4;
  string workflow = 5;
  uint32 workflow_version = 6;
  // W3C traceparent of the activation span (Phase 8 seam).
  string traceparent = 7;
  uint64 hot_wait_ms = 8;
}

// Notify only; the data is pulled with FetchJournal.
message Input {
  RunRef run = 1;
  Token token = 2;
  uint64 up_to_seq = 3;
}

message Cancel {
  RunRef run = 1;
  Token token = 2;
  uint32 reason = 3;
}

message LeaseLost {
  RunRef run = 1;
  Token token = 2;
}

message GoAway {
  string reason = 1;
}

message Drain {}

message Done {
  RunRef run = 1;
  Token token = 2;
  // postcard-encoded ostro_worker_proto::WireOutcome (D-W19).
  bytes outcome = 3;
  uint64 engine_end_seq = 4;
}

message CancelEffect {
  RunRef run = 1;
  Token token = 2;
  uint64 op = 3;
}

message GuestLogLine {
  uint32 attempt = 1;
  string level = 2;
  string message = 3;
  repeated Header fields = 4;
  uint64 ts_ms = 5;
  string trace_id = 6;
  string span_id = 7;
  string workflow = 8;
}

message GuestLogs {
  RunRef run = 1;
  Token token = 2;
  repeated GuestLogLine lines = 3;
}

// ---------------------------------------------------------------------------------------
// Bulk RPCs
// ---------------------------------------------------------------------------------------

message BlobRef {
  bytes sha = 1;
  uint64 len = 2;
}

message Header {
  string name = 1;
  string value = 2;
}

message FetchJournalRequest {
  bytes session_id = 1;
  RunRef run = 2;
  Token token = 3;
  uint64 from_seq = 4;
  uint64 to_seq = 5;
}

message JournalRow {
  uint64 seq = 1;
  uint32 kind = 2;
  oneof payload {
    bytes inline = 3;
    BlobRef blob = 4;
  }
}

message JournalPage {
  repeated JournalRow rows = 1;
  bool last = 2;
}

message FetchBlobRequest {
  bytes session_id = 1;
  RunRef run = 2;
  Token token = 3;
  bytes sha = 4;
  uint64 offset = 5;
}

message BlobChunk {
  bytes data = 1;
  bool last = 2;
  uint64 total_len = 3;
}

message AppendFrame {
  bytes session_id = 1;
  RunRef run = 2;
  Token token = 3;
  uint64 from_seq = 4;
  uint32 event_index = 5;
  bytes chunk = 6;
  bool event_end = 7;
  bool last = 8;
}

message AppendResult {
  oneof result {
    // Next sequence number after the appended events.
    uint64 next = 1;
    // A newer attempt or leader owns the run.
    bool fenced = 2;
    // Sequence conflict: the expected from_seq.
    uint64 conflict_expected = 3;
    // The run is paused (RunPaused).
    bool paused = 4;
    // Rejected (e.g. payload too large, malformed frame); human-readable reason.
    string rejected = 5;
  }
}

// Mirror of ostro_types::live::EffectRetry.
message EffectRetry {
  uint32 max_attempts = 1;
  uint64 initial_interval_ms = 2;
  uint64 max_interval_ms = 3;
  double backoff_coefficient = 4;
  repeated string non_retryable_kinds = 5;
}

message StartEffectRequest {
  bytes session_id = 1;
  RunRef run = 2;
  Token token = 3;
  uint64 op = 4;
  bool redrive = 5;
  // Header values redacted in the journal copy (names must match the journal exactly).
  repeated Header redacted_values = 6;
  EffectRetry http_retry = 7;
}

message StartEffectResponse {
  oneof result {
    bool started = 1;
    string rejected = 2;
  }
}

message RenewRequest {
  // PEM or DER PKCS#10 CSR for a fresh in-memory key.
  bytes csr = 1;
}

message RenewResponse {
  bytes client_cert = 1;
  uint64 renew_after_ms = 2;
}
