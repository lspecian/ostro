[package]
name = "ostro-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasmtime.workspace = true
tokio.workspace = true
ostro-types.workspace = true
serde.workspace = true
postcard.workspace = true
sha2.workspace = true
hmac.workspace = true
chacha20.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true
metrics.workspace = true
fail = { workspace = true, optional = true }
# Phase 8 (P8-D13/D14): the OTel API crate only (span contexts for 08-11); never the SDK here
opentelemetry.workspace = true
# 08-11: deterministic trace/span ids (P8-D14); already in the lock (ostro-partition)
blake3.workspace = true
# 09-02: component section inspection for deploy-time export-shape checks (09-07)
wasmparser.workspace = true

[features]
# Exposes the in-memory fake ActivationSink and test helpers (plan 03-08).
testkit = []
# Fault injection (plan 05-18): the `aot::write` failpoint in the AOT disk cache
# (tests/aot_failpoints.rs, `--test-threads=1`).
failpoints = ["dep:fail", "fail/failpoints"]

[dev-dependencies]
ostro-engine = { path = ".", features = ["testkit"] }
proptest.workspace = true
insta.workspace = true
tempfile.workspace = true
tokio.workspace = true
# QA-02 replay corpus (plan 05-12): journal.bin is length-prefixed `JournalEvent` protobufs,
# entry.toml is read by tests/replay_corpus.rs and written by examples/record_corpus.rs.
# All four were already in Cargo.lock (no new crates).
prost.workspace = true
bytes.workspace = true
serde_json.workspace = true
toml = "1.2"

[[test]]
name = "aot_failpoints"
required-features = ["failpoints"]

[lints]
workspace = true
