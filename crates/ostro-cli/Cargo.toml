[package]
name = "ostro-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
# REST transport (CLI-06): json + http2; `rustls` (aws-lc-rs + platform verifier, the
# same reqwest features ostro-worker/ostro-server already enable) for https:// servers
# (07-22, SEC-01). The workspace pin is default-features = false.
reqwest = { workspace = true, features = ["rustls"] }
serde_json.workspace = true
# friendly durations, same parser as ServerConfig / the REST API
jiff.workspace = true
# module sha256 for `ostro deploy`
sha2.workspace = true
tokio.workspace = true
# Phase 8: `ostro backup --to f.tar` (08-12/08-18)
tar.workspace = true
# Phase 10 (plan 10-02 declares every Phase 10 dependency once): `ostro build|init` (10-12),
# the REST client moved into ostro-client (10-09), local validation (10-13) and
# `ostro dev --watch` (10-16).
ostro-build = { path = "../ostro-build" }
ostro-client = { path = "../ostro-client" }
ostro-engine = { path = "../ostro-engine" }
# Phase 14 (14-19): `ostro deploy --signature <file>` sends Ostro-Module-Signature headers.
base64.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true

[dev-dependencies]
tempfile.workspace = true
# FakeControlPlane-backed CLI tests (08-12)
ostro-api = { path = "../ostro-api", features = ["fake"] }
# serve the fake router on 127.0.0.1:0 in tests/phase8_verbs.rs (08-12)
axum.workspace = true
# Phase 10 (10-02): --json snapshots of the Phase 10 verbs
insta.workspace = true

[lints]
workspace = true
