// Node-to-node membership notices and node operations (Phase 13, 13-03;
// CLUS-05..07, D-P13-23).
//
// Served only on the mTLS cluster listener (node identities, `PeerNode`), like
// Replication and MetaPeer; never part of the public API (no REST mirror, no
// parity check).
//
// This file is fixed by 13-03; a later change needs a STOP + re-plan note.
// p13-follow: NodeOps.StartRestart and its two messages appended (additive only,
// orchestrator decision on 13-18 deviation 2; RESERVATIONS P13 rows).
// p13-bugs2: NodeOps.DeliverInbound and its two messages appended (additive only,
// orchestrator task p13-bugs2 bug 3; RESERVATIONS P13 row).
syntax = "proto3";

package ostro.cluster.v1;

// Membership notices (13-09).
service Membership {
  // The meta leader tells a removed node that it was removed (it stops).
  rpc Removed(RemovedNotice) returns (RemovedAck);
}

message RemovedNotice {
  uint64 node_id = 1;
  string cluster_id = 2;
  string reason = 3;
}

message RemovedAck {}

// Operations a node runs on behalf of the placement controller / module GC.
service NodeOps {
  // The partition leader hands leadership to an ISR member (13-11).
  rpc HandOff(HandOffRequest) returns (HandOffResponse);
  // Which module shas the partitions this node leads still reference (13-15).
  rpc ModuleRefs(ModuleRefsRequest) returns (ModuleRefsResponse);
  // p13-follow (additive): start a keyed restart's new run on the partition this node
  // leads. DLQ restart, bulk restart and keyed rerun build the StartRun on the source
  // run's leader (payloads, pinned module, lineage); the dedupe key fixes the target
  // partition, which another node may lead.
  rpc StartRestart(StartRestartRequest) returns (StartRestartResponse);
  // p13-bugs2 (additive): deliver an outbox batch (child-run starts, parent
  // notifications, run-to-run messages) to the target partition this node leads:
  // the network half of ostro-partition's PartitionRouter. The target dedupes
  // (src, seq) exactly as for an in-process delivery.
  rpc DeliverInbound(DeliverInboundRequest) returns (DeliverInboundResponse);
}

message HandOffRequest {
  uint32 partition = 1;
  // Target node (must be in the published ISR).
  uint64 to = 2;
  // The leader epoch the caller saw.
  uint32 epoch = 3;
}

message HandOffResponse {
  bool moved = 1;
  // The new leader epoch when moved.
  uint32 new_epoch = 2;
  // Why the handoff was abandoned (empty when moved).
  string abort_reason = 3;
}

message PartitionEpoch {
  uint32 partition = 1;
  uint32 epoch = 2;
}

message ModuleRefsRequest {
  // Module sha256s (32 bytes each).
  repeated bytes shas = 1;
  // Also protect modules of retryable terminal runs.
  bool protect_resumable = 2;
  // Partitions to cover, with the epoch the caller saw.
  repeated PartitionEpoch partitions = 3;
}

message ModuleRefsResponse {
  // The referenced shas.
  repeated bytes referenced = 1;
  // Asked partitions this node does not lead at that epoch.
  repeated PartitionEpoch uncovered = 2;
}

// p13-follow: NodeOps.StartRestart.
message StartRestartRequest {
  // The target partition (this node must lead it).
  uint32 partition = 1;
  // The partition command (frozen `ostro_types::command::Command` bytes) holding the
  // StartRun, every payload inline; empty with `lookup_only`.
  bytes start_run = 2;
  // Admit through the StartRun rate limit first (bulk restart, rerun).
  bool rate_limit = 3;
  // Rerun: fit the copied prefix into this many encoded bytes (0 = no prefix).
  uint64 prefix_bound = 4;
  // Only resolve the run `idempotency_key` maps to; nothing is submitted.
  bool lookup_only = 5;
  // `lookup_only`: the workflow and the dedupe key.
  string workflow = 6;
  bytes idempotency_key = 7;
}

message StartRestartResponse {
  // The new run, the existing run of the dedupe key, or empty (lookup: none).
  bytes run_id = 1;
  // The dedupe key already mapped to `run_id`.
  bool existing = 2;
  // The partition refused the StartRun (the RejectReason, for the caller's error).
  string rejected = 3;
}

// p13-bugs2: NodeOps.DeliverInbound.
message DeliverInboundRequest {
  // The target partition (this node must lead it).
  uint32 partition = 1;
  // The partition command (frozen `ostro_types::command::Command` bytes) holding the
  // InboundBatch, exactly as the target's log stores it.
  bytes batch = 2;
}

message DeliverInboundResponse {
  // The target's apply outcome code (`ApplyOutcome::code`: 0 accepted, 1 duplicate,
  // 16 + RejectReason index rejected).
  uint32 outcome = 1;
  // The rejection (debug text) when `outcome` >= 16.
  string rejected = 2;
}
