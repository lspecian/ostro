// Workflow listing and activation
// (REST: GET /v1/workflows, POST /v1/workflows/{name}/activate), plus the
// Phase 5 run policies (REST: PUT/GET /v1/workflows/{name}/policy and
// PUT/GET /v1/queues/{name}/policy).
syntax = "proto3";

package ostro.api.v1;

service Workflows {
  // List all registered workflows with their versions.
  rpc List(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Make a version the active one for new runs.
  rpc Activate(ActivateWorkflowRequest) returns (WorkflowInfo);
  // Replace a workflow's run policy (affects future runs only).
  rpc SetPolicy(SetWorkflowPolicyRequest) returns (RunPolicy);
  // A workflow's run policy (unset fields = no override).
  rpc GetPolicy(GetWorkflowPolicyRequest) returns (RunPolicy);
  // Replace a queue's run policy (affects future runs only).
  rpc SetQueuePolicy(SetQueuePolicyRequest) returns (RunPolicy);
  // A queue's run policy (unset fields = no override).
  rpc GetQueuePolicy(GetQueuePolicyRequest) returns (RunPolicy);
  // Stop granting activations to the workflow's runs (Phase 7, 07-11; idempotent).
  rpc PauseWorkflow(PauseWorkflowRequest) returns (WorkflowPauseState);
  // Resume the workflow's runs (Phase 7, 07-11; idempotent).
  rpc ResumeWorkflow(ResumeWorkflowRequest) returns (WorkflowPauseState);
}

message ListWorkflowsRequest {}

message ListWorkflowsResponse {
  repeated WorkflowInfo workflows = 1;
}

message WorkflowVersionInfo {
  uint32 version = 1;
  string module_sha256 = 2;
  optional string default_queue = 3;
  optional uint64 run_timeout_ms = 4;
}

message WorkflowInfo {
  string name = 1;
  optional uint32 active_version = 2;
  repeated WorkflowVersionInfo versions = 3;
  // Optimistic-concurrency version of the workflow record.
  uint64 record_version = 4;
}

message ActivateWorkflowRequest {
  string name = 1;
  uint32 version = 2;
  // When set, the activation fails unless record_version matches.
  optional uint64 expected_version = 3;
}

// --- Phase 5 run policies (OPS-06 / WF-09) -------------------------------

// Per-workflow or per-queue defaults resolved at run start
// (request > workflow policy > queue policy > server config).
message RunPolicy {
  // How long a terminal run and its journal are kept.
  optional uint64 retention_ms = 1;
  // Schedule-to-start timeout for the initial start.
  optional uint64 schedule_to_start_ms = 2;
}

message SetWorkflowPolicyRequest {
  string name = 1;
  RunPolicy policy = 2;
}

message GetWorkflowPolicyRequest {
  string name = 1;
}

message SetQueuePolicyRequest {
  string name = 1;
  RunPolicy policy = 2;
}

message GetQueuePolicyRequest {
  string name = 1;
}

// --- Phase 7 workflow pause / resume (07-11; REST POST /v1/workflows/{name}/pause|resume) ---

message PauseWorkflowRequest {
  string name = 1;
}

message ResumeWorkflowRequest {
  string name = 1;
}

message WorkflowPauseState {
  string workflow = 1;
  bool paused = 2;
  // False when the workflow already was in the requested state.
  bool changed = 3;
}
