// Cluster membership, placement, upgrades and module lifecycle (Phase 13, 13-03;
// API-08, CLUS-05..07): services Cluster and ModuleLifecycle.
//
// REST mirrors:
//   POST /v1/cluster/init, POST /v1/cluster/join, GET /v1/cluster/status,
//   POST /v1/cluster/tokens, POST /v1/cluster/members/{id}/remove,
//   POST /v1/cluster/members/{id}/drain, POST /v1/cluster/reassign,
//   POST /v1/cluster/rebalance, GET /v1/cluster/upgrade,
//   POST /v1/cluster/upgrade/{finalize,hold,release},
//   DELETE /v1/modules/{sha}, POST /v1/modules/gc, POST /v1/runs/migrate.
//
// The messages mirror the ostro_api::phase13 domain types field for field (u8
// fields travel as uint32 and are range-checked). A server without the Phase 13
// extensions does not mount these services (UNIMPLEMENTED). Errors carry the same
// JSON details as REST. Join and node-token messages carry secrets: their Debug
// output redacts them.
//
// This file is fixed by 13-03; a later change needs a STOP + re-plan note.
syntax = "proto3";

package ostro.api.v1;

service Cluster {
  // Promote this single node to a cluster.
  rpc Init(InitClusterRequest) returns (ClusterStatus);
  // Admit a joining node (token-authenticated in the body).
  rpc Join(JoinClusterRequest) returns (JoinClusterResponse);
  // Cluster status.
  rpc Status(ClusterStatusRequest) returns (ClusterStatus);
  // Create a node join token; the secret is in this response only.
  rpc CreateNodeToken(CreateNodeTokenRequest) returns (NodeTokenCreated);
  // Remove a member.
  rpc Remove(RemoveMemberRequest) returns (ClusterStatus);
  // Drain a member (hand off its partitions).
  rpc Drain(DrainMemberRequest) returns (ClusterStatus);
  // Start or cancel a partition reassignment.
  rpc Reassign(ReassignPartitionRequest) returns (ClusterStatus);
  // Rebalance replicas and preferred leaders.
  rpc Rebalance(RebalanceRequest) returns (ClusterStatus);
  // Feature levels and finalization state.
  rpc UpgradeStatus(UpgradeStatusRequest) returns (UpgradeStatus);
  // Finalize the highest common level.
  rpc UpgradeFinalize(UpgradeFinalizeRequest) returns (UpgradeStatus);
  // Hold the current level.
  rpc UpgradeHold(UpgradeHoldRequest) returns (UpgradeStatus);
  // Release a hold.
  rpc UpgradeRelease(UpgradeReleaseRequest) returns (UpgradeStatus);
}

service ModuleLifecycle {
  // Retire a module and its workflow versions.
  rpc RetireModule(RetireModuleRequest) returns (RetireModuleResponse);
  // Run one module GC round now.
  rpc RunModuleGc(RunModuleGcRequest) returns (GcRunReport);
  // Replay-check and repin runs to another workflow version.
  rpc MigrateRuns(MigrateRunsRequest) returns (MigrateRunsReport);
}

message InitClusterRequest {
  optional string advertise = 1;
  optional uint32 rf = 2;
  optional uint32 min_insync = 3;
}

message NodeAdvertise {
  string api = 1;
  string cluster = 2;
  optional string repl = 3;
}

message NodeVersion {
  string ostro_version = 1;
  uint32 level_min = 2;
  uint32 level_max = 3;
  string wasmtime = 4;
  uint32 event_codec_ver = 5;
  repeated string wit_lines = 6;
}

message JoinClusterRequest {
  string token = 1;
  string csr_pem = 2;
  NodeAdvertise advertise = 3;
  NodeVersion node_version = 4;
  optional uint64 resume_node_id = 5;
}

message SeedNode {
  uint64 id = 1;
  string addr = 2;
  optional string repl_addr = 3;
}

message JoinClusterResponse {
  uint64 node_id = 1;
  string cluster_id = 2;
  uint32 partitions = 3;
  string ca_cert_pem = 4;
  string node_cert_pem = 5;
  repeated SeedNode seeds = 6;
  uint32 finalized_level = 7;
}

message ClusterStatusRequest {}

message CreateNodeTokenRequest {
  optional uint64 ttl_secs = 1;
}

message NodeTokenCreated {
  string id = 1;
  string token = 2;
  uint64 expires_at_ms = 3;
  string ca_hash = 4;
}

message ClusterMember {
  uint64 node_id = 1;
  string addr = 2;
  optional string cluster_addr = 3;
  // joining, active, draining or removed.
  string state = 4;
  NodeVersion version = 5;
  bool live = 6;
  // voter, learner, outgoing or none.
  string raft_role = 7;
}

message ClusterReplicationPolicy {
  uint32 rf = 1;
  uint32 min_insync = 2;
  uint32 max_voters = 3;
}

message PartitionReassignment {
  uint32 partition = 1;
  repeated uint64 target = 2;
  repeated uint64 adding = 3;
  repeated uint64 removing = 4;
  uint64 started_at_ms = 5;
}

message ClusterStatus {
  string cluster_id = 1;
  repeated ClusterMember members = 2;
  repeated uint64 voters = 3;
  repeated uint64 learners = 4;
  repeated uint64 voters_outgoing = 5;
  uint64 meta_leader = 6;
  uint32 finalized = 7;
  optional uint32 hold = 8;
  uint32 level_min = 9;
  uint32 level_max = 10;
  ClusterReplicationPolicy policy = 11;
  repeated PartitionReassignment reassignments = 12;
}

message RemoveMemberRequest {
  uint64 node_id = 1;
  bool force = 2;
}

message DrainMemberRequest {
  uint64 node_id = 1;
}

message ReassignPartitionRequest {
  uint32 partition = 1;
  repeated uint64 replicas = 2;
  bool cancel = 3;
}

message RebalanceRequest {}

message MemberLevel {
  uint64 node_id = 1;
  uint32 level_min = 2;
  uint32 level_max = 3;
  bool live = 4;
}

message UpgradeStatus {
  uint32 finalized = 1;
  optional uint32 hold = 2;
  uint32 common_level_max = 3;
  bool auto_finalize = 4;
  repeated MemberLevel members = 5;
}

message UpgradeStatusRequest {}
message UpgradeFinalizeRequest {}
message UpgradeHoldRequest {}
message UpgradeReleaseRequest {}

message RetireModuleRequest {
  // Module sha256 (hex).
  string sha256 = 1;
}

message WorkflowVersionRef {
  string name = 1;
  uint32 version = 2;
}

message RetireModuleResponse {
  string sha256 = 1;
  uint64 retired_at_ms = 2;
  repeated WorkflowVersionRef versions = 3;
}

message RunModuleGcRequest {}

message GcRunReport {
  repeated string candidates = 1;
  repeated string deleted = 2;
  repeated string referenced = 3;
  bool postponed = 4;
  optional string reason = 5;
}

message MigrateRunsRequest {
  string workflow = 1;
  // The source: a workflow version or a module sha256 (hex). Required.
  oneof from {
    uint32 from_version = 2;
    string from_sha = 3;
  }
  uint32 to_version = 4;
  optional string filter = 5;
  optional uint32 limit = 6;
  bool dry_run = 7;
}

message MigrateFailure {
  string run_id = 1;
  uint64 seq = 2;
  string detail = 3;
}

message MigrateRunsReport {
  repeated string passed = 1;
  repeated string repinned = 2;
  repeated MigrateFailure failed = 3;
  repeated string busy = 4;
  repeated string seq_mismatch = 5;
}
