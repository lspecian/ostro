// Run start, inspection, history and listing
// (REST: POST /v1/runs, GET /v1/runs/{id}, GET /v1/runs/{id}/history,
// GET /v1/runs), plus the Phase 5 lifecycle calls (REST:
// POST /v1/runs/{id}/signals/{name}, /cancel, /terminate, /retry and
// GET /v1/runs/{id}/result).
syntax = "proto3";

package ostro.api.v1;

import "ostro/api/v1/common.proto";

service Runs {
  rpc Start(StartRunRequest) returns (StartRunResponse);
  rpc Get(GetRunRequest) returns (RunInfo);
  rpc History(RunHistoryRequest) returns (RunHistoryResponse);
  rpc List(ListRunsRequest) returns (ListRunsResponse);
  // Deliver a named signal to a run (Phase 5, API-05).
  rpc Signal(SignalRunRequest) returns (SignalRunResponse);
  // Request graceful cancellation (idempotent).
  rpc Cancel(CancelRunRequest) returns (CancelRunResponse);
  // Hard-stop a run (status TERMINATED).
  rpc Terminate(TerminateRunRequest) returns (TerminateRunResponse);
  // Resume a resumable terminal run in place, or restart it as a new run.
  rpc Retry(RetryRunRequest) returns (RetryRunResponse);
  // Long-poll a run's outcome (Phase 5, API-06). Not-terminal-yet is not an
  // error: the response has completed = false.
  rpc AwaitResult(AwaitResultRequest) returns (AwaitResultResponse);
  // Pause a run: no new activations until resumed (Phase 7, 07-11; idempotent).
  rpc PauseRun(PauseRunRequest) returns (RunPauseState);
  // Resume a paused run (Phase 7, 07-11; idempotent).
  rpc ResumeRun(ResumeRunRequest) returns (RunPauseState);
}

message StartRunRequest {
  string workflow = 1;
  // UTF-8 JSON input.
  bytes input_json = 2;
  // Defaults to the workflow's active version.
  optional uint32 version = 3;
  optional string queue = 4;
  optional uint64 delay_ms = 5;
  optional int32 priority = 6;
  repeated string tags = 7;
  // W3C traceparent.
  optional string traceparent = 8;
  optional string tenant = 9;
  optional string idempotency_key = 10;
  ConflictPolicy conflict_policy = 11;
  optional string concurrency_key = 12;
  // Schedule-to-start timeout override (ms; unset = workflow policy, then queue policy;
  // 0 = none). Phase 5 (05-13).
  optional uint64 schedule_to_start_timeout_ms = 13;
  // Retention override for the terminal run (ms; unset or 0 = workflow policy, queue
  // policy, then the server's [runs] retention). Phase 5 (05-13).
  optional uint64 retention_ms = 14;
  // Validate only: same checks as a real start, nothing is submitted. Phase 5 (05-13).
  bool dry_run = 15;
}

message StartRunResponse {
  // For a dry run: the existing run the idempotency key maps to, else empty.
  string run_id = 1;
  // False when an existing run was returned for the idempotency key.
  bool created = 2;
  // Echo of the request flag. Phase 5 (05-13).
  bool dry_run = 3;
}

message GetRunRequest {
  string run_id = 1;
}

message RunInfo {
  string run_id = 1;
  string workflow = 2;
  uint32 version = 3;
  string module_sha256 = 4;
  string queue = 5;
  RunStatus status = 6;
  optional uint32 attempt = 7;
  repeated string tags = 8;
  optional string tenant = 9;
  optional string traceparent = 10;
  int32 priority = 11;
  uint64 created_at_ms = 12;
  optional uint64 completed_at_ms = 13;
  optional bytes published_status_json = 14;
  optional bytes result_json = 15;
  optional string failure = 16;
  optional string concurrency_key = 17;
  // Durable count of retryable attempt failures (the meaningful retry count; `attempt`
  // counts dispatches, including resumes). Phase 5 (05-13).
  uint32 attempt_failures = 18;
  // Resolved retention of the terminal run (ms; unset = keep forever). Phase 5 (05-13).
  optional uint64 retention_ms = 19;
  // Resolved schedule-to-start timeout (ms; unset = none). Phase 5 (05-13).
  optional uint64 schedule_to_start_ms = 20;
  // The pause mark while the run is paused (unset = not paused). Phase 7 (07-22).
  RunPauseMark pause = 21;
}

// Why and since when a run is paused. Phase 7 (07-22).
message RunPauseMark {
  // "operator" | "retries_exhausted" | "reason_<n>" (unknown code).
  string reason = 1;
  // Operator note or auto-pause detail (may be empty).
  string detail = 2;
  // When the pause took effect (ms since the Unix epoch).
  uint64 at_ms = 3;
}

message RunHistoryRequest {
  string run_id = 1;
  uint64 from_seq = 2;
  // 0 = server default.
  uint32 limit = 3;
}

message HistoryEvent {
  uint64 seq = 1;
  string kind = 2;
  uint64 ts_ms = 3;
  string summary = 4;
  // UTF-8 JSON details.
  bytes details_json = 5;
  // Activation attempt that wrote the event (epoch << 32 | n); unset when not
  // recorded. Phase 11 (11-09, D-P11-18).
  optional fixed64 attempt = 6;
}

message RunHistoryResponse {
  repeated HistoryEvent events = 1;
  // Set when more events are available.
  optional uint64 next_from_seq = 2;
}

message ListRunsRequest {
  optional string workflow = 1;
  optional RunStatus status = 2;
  optional string queue = 3;
  optional string tag = 4;
  optional uint64 created_after_ms = 5;
  optional uint64 created_before_ms = 6;
  // 0 = server default.
  uint32 limit = 7;
  optional string page_token = 8;
  // Every tag must match (AND, max 8 including `tag`). Phase 11 (11-09, D-P11-10).
  repeated string tags = 9;
  // Result order (UNSPECIFIED = oldest first). Phase 11.
  ListOrder order = 10;
  // Only DLQ members (failed / timed-out runs not dismissed or requeued). Phase 11.
  bool dlq = 11;
}

// Order of a run listing. Phase 11 (11-09).
enum ListOrder {
  LIST_ORDER_UNSPECIFIED = 0;
  LIST_ORDER_OLDEST = 1;
  LIST_ORDER_NEWEST = 2;
}

message RunSummary {
  string run_id = 1;
  string workflow = 2;
  uint32 version = 3;
  RunStatus status = 4;
  string queue = 5;
  uint64 created_at_ms = 6;
  repeated string tags = 7;
}

message ListRunsResponse {
  repeated RunSummary runs = 1;
  optional string next_page_token = 2;
}

// --- Phase 5 lifecycle (API-05 / API-06) ---------------------------------

message SignalRunRequest {
  string run_id = 1;
  string name = 2;
  // UTF-8 JSON payload; empty = JSON null.
  bytes payload_json = 3;
  // Optional dedupe id: a repeated request_id is acknowledged, not re-delivered.
  optional string request_id = 4;
  // Validate only; nothing is submitted.
  bool dry_run = 5;
}

message SignalRunResponse {
  bool accepted = 1;
  // True when request_id was already seen for this run.
  bool duplicate = 2;
  bool dry_run = 3;
}

message CancelRunRequest {
  string run_id = 1;
  optional string reason = 2;
  bool dry_run = 3;
}

message CancelRunResponse {
  // True when cancellation had already been requested.
  bool already_requested = 1;
  bool dry_run = 2;
}

message TerminateRunRequest {
  string run_id = 1;
  optional string reason = 2;
  bool dry_run = 3;
}

message TerminateRunResponse {
  // TERMINATED (or what it would be, for dry_run).
  RunStatus status = 1;
  bool dry_run = 2;
}

message RetryRunRequest {
  string run_id = 1;
  bool dry_run = 2;
}

// How a retry was carried out.
enum RetryMode {
  RETRY_MODE_UNSPECIFIED = 0;
  // The same run resumes from its journal.
  RETRY_MODE_RESUMED = 1;
  // A new run linked to the old one was started.
  RETRY_MODE_RESTARTED = 2;
}

message RetryRunResponse {
  RetryMode mode = 1;
  // The resumed run, or the new run for RESTARTED.
  string run_id = 2;
  bool dry_run = 3;
}

message AwaitResultRequest {
  string run_id = 1;
  // Maximum wait; 0 = answer immediately. Capped at 60 000 by the server.
  uint64 wait_ms = 2;
  // Follow CONTINUED_AS_NEW successors to the final run of the chain.
  bool follow_continuations = 3;
}

message AwaitResultResponse {
  // The run the answer is about (the last successor when following).
  string run_id = 1;
  RunStatus status = 2;
  // True when status is terminal.
  bool completed = 3;
  // UTF-8 JSON result of a completed run.
  optional bytes result_json = 4;
  // UTF-8 JSON failure of a failed run.
  optional bytes failure_json = 5;
}

// --- Phase 7 run pause / resume (07-11; REST POST /v1/runs/{id}/pause|resume) ---

message PauseRunRequest {
  string run_id = 1;
  // Operator note stored with the pause mark.
  optional string detail = 2;
}

message ResumeRunRequest {
  string run_id = 1;
}

message RunPauseState {
  string run_id = 1;
  bool paused = 2;
  // False when the run already was in the requested state.
  bool changed = 3;
}
