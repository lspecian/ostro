[package]
name = "ostro-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
config.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
# CancellationToken for activations (04-16)
tokio-util.workspace = true
# used by 04-19 (`--ephemeral` TempDir) and 04-17
tempfile.workspace = true
# OS RNG for run rng_seed / token key (04-17)
getrandom.workspace = true
ostro-engine = { path = "../ostro-engine" }
# storage <-> engine seam (04-15): PartitionSink, derive, journal_io
ostro-types.workspace = true
ostro-partition = { path = "../ostro-partition" }
ostro-log = { path = "../ostro-log" }
ostro-blob = { path = "../ostro-blob" }
bytes.workspace = true
async-trait.workspace = true
# server bootstrap + real ControlPlane (04-17)
ostro-meta = { path = "../ostro-meta" }
ostro-api = { path = "../ostro-api" }
axum.workspace = true
sha2.workspace = true
uuid.workspace = true
fail = { workspace = true, optional = true }
# Phase 8 (08-01 declares every Phase 8 dependency, P8-D21): OTLP traces + logs (08-04/08-11),
# Prometheus /metrics (08-04/08-16), bottomless (08-13/08-18), triggers (08-14/08-15)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
metrics-exporter-prometheus.workspace = true
ostro-backup = { path = "../ostro-backup" }
ostro-objstore = { path = "../ostro-objstore" }
ostro-triggers = { path = "../ostro-triggers" }
hmac.workspace = true

[features]
# Fault injection (plan 05-18): the executor's own failpoints (executor::before_append,
# executor::after_append_before_done) plus every failpoint underneath: dispatcher, state,
# WAL and blob (ostro-partition / ostro-log / ostro-blob), meta (ostro-meta) and AOT
# (ostro-engine). The `ostro` binary forwards its `failpoints` feature here.
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "ostro-partition/failpoints",
    "ostro-log/failpoints",
    "ostro-blob/failpoints",
    "ostro-meta/failpoints",
    "ostro-engine/failpoints",
    "ostro-backup/failpoints",
]

[dev-dependencies]
ostro-engine = { path = "../ostro-engine", features = ["testkit"] }
ostro-testkit.workspace = true
# full-server tests (04-17): REST + gRPC clients on the one port
reqwest.workspace = true
tonic.workspace = true
ostro-proto = { path = "../ostro-proto" }
# in-memory span/log exporters for the OTel tests (08-04, 08-11, 08-21)
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[[test]]
name = "failpoints_phase5"
required-features = ["failpoints"]

[lints]
workspace = true
