[package]
name = "ostro-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
config.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
# CancellationToken for activations (04-16)
tokio-util.workspace = true
# used by 04-19 (`--ephemeral` TempDir) and 04-17
tempfile.workspace = true
# OS RNG for run rng_seed / token key (04-17)
getrandom.workspace = true
ostro-engine = { path = "../ostro-engine" }
# storage <-> engine seam (04-15): PartitionSink, derive, journal_io
ostro-types.workspace = true
ostro-partition = { path = "../ostro-partition" }
ostro-log = { path = "../ostro-log" }
ostro-blob = { path = "../ostro-blob" }
bytes.workspace = true
async-trait.workspace = true
# server bootstrap + real ControlPlane (04-17)
ostro-meta = { path = "../ostro-meta" }
ostro-api = { path = "../ostro-api" }
axum.workspace = true
sha2.workspace = true
uuid.workspace = true
fail = { workspace = true, optional = true }
# Phase 8 (08-01 declares every Phase 8 dependency, P8-D21): OTLP traces + logs (08-04/08-11),
# Prometheus /metrics (08-04/08-16), bottomless (08-13/08-18), triggers (08-14/08-15)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
metrics-exporter-prometheus.workspace = true
ostro-backup = { path = "../ostro-backup" }
ostro-objstore = { path = "../ostro-objstore" }
ostro-triggers = { path = "../ostro-triggers" }
# webhook delivery counter (08-15)
metrics.workspace = true
hmac.workspace = true
# Phase 6 effects bridge (06-02): BridgeServices wiring (06-14), admin impl (06-16)
ostro-bridge = { path = "../ostro-bridge" }
base64.workspace = true
# Phase 7 (07-02 declares every Phase 7 dependency, D-W17): cluster CA + certs (07-06),
# client-listener TLS (07-06), ACME (07-10), worker protocol (07-09/07-12), spill sampler
# getrusage (07-13). tonic TLS features: never tls-ring / tls-webpki-roots / tls-native-roots.
tonic = { workspace = true, features = ["tls-aws-lc", "tls-connect-info"] }
ostro-worker-proto = { path = "../ostro-worker-proto" }
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
axum-server.workspace = true
instant-acme.workspace = true
arc-swap.workspace = true
libc.workspace = true
# Phase 12 (12-01 declares every Phase 12 dependency): cluster transport, meta peer,
# controller, fetch and install (wired by 12-14)
ostro-cluster = { path = "../ostro-cluster" }
# Phase 11 (11-03): embedded UI router, merged by p11.rs (11-04/11-15)
ostro-ui.workspace = true
# Phase 14 (14-01, D-P14-37): module signatures (14-05), direct aws-lc-rs for token RNG /
# constant-time compare / ECDSA + Ed25519 / UI session HMAC (14-03, 14-05, 14-21), and the
# Kafka trigger client behind the `kafka` feature (14-32, D-P14-42).
minisign-verify.workspace = true
aws-lc-rs.workspace = true
ostro-kafka = { path = "../ostro-kafka", optional = true }

[features]
# Fault injection (plan 05-18): the executor's own failpoints (executor::before_append,
# executor::after_append_before_done) plus every failpoint underneath: dispatcher, state,
# WAL and blob (ostro-partition / ostro-log / ostro-blob), meta (ostro-meta) and AOT
# (ostro-engine). The `ostro` binary forwards its `failpoints` feature here.
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "ostro-partition/failpoints",
    "ostro-log/failpoints",
    "ostro-blob/failpoints",
    "ostro-meta/failpoints",
    "ostro-engine/failpoints",
    "ostro-backup/failpoints",
    "ostro-bridge/failpoints",
    "ostro-cluster/failpoints",
    # Phase 13 (13-01, D-P13-7): OSTRO_TEST_LEVEL_MAX level emulation
    "ostro-types/level-emulation",
]

# Phase 14 (D-P14-42): the Kafka-protocol topic-consumer trigger (default-on in `ostro`).
kafka = ["dep:ostro-kafka"]

[dev-dependencies]
ostro-engine = { path = "../ostro-engine", features = ["testkit"] }
ostro-testkit = { workspace = true, features = ["mock-http", "db", "canary"] }
# full-server tests (04-17): REST + gRPC clients on the one port
tonic.workspace = true
ostro-proto = { path = "../ostro-proto" }
# in-memory span/log exporters for the OTel tests (08-04, 08-11, 08-21)
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# Phase 7 (07-02): in-process workers, HTTPS clients (reqwest also serves the 04-17
# full-server tests)
ostro-worker = { path = "../ostro-worker" }
reqwest = { workspace = true, features = ["rustls", "json"] }
# Phase 14 (14-01): property tests (audit chain 14-04, quotas 14-06, SkewClock 14-10), the
# 14-02 fakes behind the real guard (14-03, 14-15) and the Kafka testkit (14-32).
proptest.workspace = true
tempfile.workspace = true
ostro-api = { path = "../ostro-api", features = ["fake"] }
ostro-kafka = { path = "../ostro-kafka", features = ["testkit"] }

[[test]]
name = "failpoints_phase5"
required-features = ["failpoints"]

[lints]
workspace = true
