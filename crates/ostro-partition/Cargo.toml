[package]
name = "ostro-partition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fault-injection suites (tests/fatal_io_state.rs): state-store failpoints
# (state::commit, state::persist) plus the WAL/blob failpoints underneath.
failpoints = ["dep:fail", "fail/failpoints", "ostro-log/failpoints", "ostro-blob/failpoints"]

[dependencies]
ostro-types.workspace = true
ostro-log = { path = "../ostro-log" }
ostro-blob = { path = "../ostro-blob" }
fjall.workspace = true
serde.workspace = true
postcard.workspace = true
prost.workspace = true
blake3.workspace = true
bytes.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
fail = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
ostro-testkit.workspace = true
# Format corpus (plan 05-12): tests/format_corpus.rs reads format.toml. Already in Cargo.lock.
toml = "1.2"

[[test]]
name = "fatal_io_state"
required-features = ["failpoints"]

[lints]
workspace = true
