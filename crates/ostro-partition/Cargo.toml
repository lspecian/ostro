[package]
name = "ostro-partition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fault-injection suites (tests/fatal_io_state.rs): state-store failpoints
# (state::commit, state::persist), the dispatcher's (dispatcher::before_grant,
# dispatcher::before_ack, plan 05-18) plus the WAL/blob failpoints underneath.
failpoints = ["dep:fail", "fail/failpoints", "ostro-log/failpoints", "ostro-blob/failpoints"]

[dependencies]
ostro-types.workspace = true
ostro-log = { path = "../ostro-log" }
ostro-blob = { path = "../ostro-blob" }
fjall.workspace = true
serde.workspace = true
postcard.workspace = true
prost.workspace = true
blake3.workspace = true
bytes.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
fail = { workspace = true, optional = true }
# Phase 8 (08-01 declares; 08-02 OSNP snapshot frames: CRC32C + optional lz4 frames)
lz4_flex.workspace = true
crc32c.workspace = true
# 08-09: sha256 of each local snapshot file (SnapshotTaken; the 08-13 remote key)
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
ostro-testkit.workspace = true
# Format corpus (plan 05-12): tests/format_corpus.rs reads format.toml. Already in Cargo.lock.
toml = "1.2"

[[test]]
name = "fatal_io_state"
required-features = ["failpoints"]

# dispatcher::before_grant / dispatcher::before_ack (plan 05-18)
[[test]]
name = "dispatcher_failpoints"
required-features = ["failpoints"]

[lints]
workspace = true
