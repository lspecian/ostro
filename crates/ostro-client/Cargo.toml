[package]
name = "ostro-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Ostro REST client and spawned-server test kit for Rust"
publish = false

# Bundleable (10-08 copies this crate into `ostro init` projects): explicit versions only,
# textually identical to the root [workspace.dependencies] specs, no `workspace = true`
# except [lints] (the bundler strips that table).
[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["time", "process", "io-util", "macros", "rt"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[features]
default = []
# spawned-server test kit (`ostro_client::testing`, 10-17)
testing = []

[lints]
workspace = true
