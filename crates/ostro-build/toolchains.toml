# Pinned hermetic toolchains (D-P10-1..D-P10-4, plan 10-07).
#
# Every artefact is downloaded only through `ostro_build::toolchain::ensure`, which streams
# the sha256 and compares it with the pin below BEFORE anything is extracted or executed.
# The file is embedded into the binary (`include_str!`); the toolchain-set id is the first 16
# hex of sha256(this file), so editing any byte here changes the id (and build input hashes).
#
# Schema: one `[[tool]]` per (tool, platform):
#   name      uv | componentize-py | node | rustup-init | zig
#   version   exact version
#   platform  linux-x86_64 | linux-aarch64 | macos-aarch64 | macos-x86_64
#   kind      tar.gz | tar.xz | binary | wheel (wheels are verified, never extracted)
#   url       https URL
#   sha256    64 lower-case hex, from the official checksum source named in `# source:`
#   strip     optional leading directory dropped on extraction
#   max_bytes optional size cap (default 512 MiB)
#
# Mirrors: OSTRO_TOOLCHAIN_MIRROR=<base> rewrites every URL here to `<base>/<url path>`; the
# sha256 stays authoritative. The builders map the same base to
# UV_PYTHON_INSTALL_MIRROR=<base>/python-build-standalone (10-15) and
# RUSTUP_DIST_SERVER=<base>/rustup + RUSTUP_UPDATE_ROOT=<base>/rustup/rustup (10-12).
#
# CPython is NOT pinned here: the host interpreter is installed by the pinned uv
# (`uv python install 3.12`, UV_PYTHON_PREFERENCE=only-managed), and uv verifies its own
# python-build-standalone downloads (D-P10-2).
#
# The npm toolchain (jco, rolldown) is not pinned here either: 10-15 runs `npm ci` with the
# pinned Node against the embedded sdks/scripts/toolchain package-lock.json (integrity hashes).

