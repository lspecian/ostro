{{- /*
Chart-generated Secrets (dev convenience; existingSecret is preferred). They are rendered
only at install and carry helm.sh/resource-policy: keep, so an upgrade never regenerates
(and never deletes) the sealing key, the bootstrap bearer or the cluster CA: a new sealing
key would make sealed secrets unreadable and a new CA would split the cluster. A literal
auth.bootstrapToken is rendered on every release (it is in the values anyway).
*/}}
{{- if and (eq .Values.auth.mode "token") (not .Values.auth.existingSecret) (or .Values.auth.bootstrapToken .Release.IsInstall) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostro.authSecret" . }}
  labels:
    {{- include "ostro.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.auth.bootstrapToken }}
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.bootstrapToken | b64enc | quote }}
  {{- else }}
  {{- /* ostro_<otk_ + 16 base32>_<52 base32, canonical: last char a|q> (p14/tokens.rs) */}}
  {{- $tok := printf "ostro_otk_%s_%sa" (randAlpha 16 | lower) (randAlpha 51 | lower) }}
  {{ .Values.auth.existingSecretKey }}: {{ $tok | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.sealing.existingSecret) .Release.IsInstall }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostro.sealingSecret" . }}
  labels:
    {{- include "ostro.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* randBytes returns base64 already; the server wants the base64 text itself. */}}
  {{ .Values.sealing.existingSecretKey }}: {{ randBytes 32 | b64enc | quote }}
{{- end }}
{{- if and (not .Values.tls.clusterCa.existingSecret) .Release.IsInstall }}
{{- $key := genPrivateKey "ecdsa" }}
{{- $ca := genCAWithKey (printf "ostro cluster %s" (include "ostro.clusterId" .)) 3650 $key }}
{{- $der := $ca.Cert | replace "-----BEGIN CERTIFICATE-----" "" | replace "-----END CERTIFICATE-----" "" | replace "\n" "" | trim | b64dec }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ostro.caSecret" . }}
  labels:
    {{- include "ostro.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.tls.clusterCa.certKey }}: {{ $ca.Cert | b64enc | quote }}
  {{ .Values.tls.clusterCa.keyKey }}: {{ $ca.Key | b64enc | quote }}
  {{- /* What `ostro worker --ca-hash` pins: sha256 of the CA certificate DER. */}}
  ca-hash: {{ printf "sha256:%s" (sha256sum $der) | b64enc | quote }}
{{- end }}
