# cargo-nextest configuration (shared by Phases 2 and 3; edit additively).

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
retries = 0

# Phase 2 crash/recovery suites (kill -9 child processes): long timeouts, serial, no retries.
[profile.crash]
slow-timeout = { period = "120s", terminate-after = 10 }
test-threads = 1
retries = 0
